name: Build Official Signed IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Apple Certificate and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          # 1. فك تشفير الملفات
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          echo "$PROVISION_BASE64" | base64 --decode > profile.mobileprovision
          
          # 2. إنشاء Keychain مؤقت وتثبيت الشهادة
          security create-keychain -p "build" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build" build.keychain
          
          # 3. تثبيت ملف التعريف في المسار الذي يبحث عنه Xcode
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          uuid=$(grep UUID -A1 -a profile.mobileprovision | grep -io "[-A-Z0-9]\{36\}")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      - name: Build and Sign IPA
        run: |
          flutter pub get
          # بناء ملف IPA رسمي وموقع بالشهادة
          flutter build ios --release --export-options-plist=ios/ExportOptions.plist || flutter build ios --release --no-codesign
          
          # تجميع يدوي لضمان استخراج الملف حتى لو فشل التوقيع التلقائي
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r instamod-final.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-final-app
          path: build/ios/iphoneos/instamod-final.ipa
