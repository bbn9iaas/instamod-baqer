name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Force Recreate iOS Files
        run: |
          rm -rf ios/
          flutter create . --platforms=ios
          
      - name: Build IPA (No Signing)
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r instamod-baqer.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: instamod-ipa-file
          path: build/ios/iphoneos/instamod-baqer.ipa
