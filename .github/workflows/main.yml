name: Build Official Signed IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Apple Certificate
        env:
          CERT_P12: ${{ secrets.P12_BASE64 }}
          CERT_PASS: ${{ secrets.P12_PASSWORD }}
          PROV_PROFILE: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          # فك تشفير الشهادة وملف الوصف
          echo $CERT_P12 | base64 --decode > certificate.p12
          echo $PROV_PROFILE | base64 --decode > profile.mobileprovision
          
          # إنشاء Keychain لتخزين الشهادة في سيرفر GitHub
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERT_PASS" -A
          security list-keychains -d user -s build.keychain
          
          # تثبيت ملف الوصف في مكانه الصحيح
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          
      - name: Build IPA
        run: |
          flutter pub get
          # بناء التطبيق بصيغة Release نهائية
          flutter build ios --release --no-codesign
          
          # تجميع ملف IPA يدوياً
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r instamod-baqer-signed.ipa Payload
          
      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: instamod-final-ipa
          path: build/ios/iphoneos/instamod-baqer-signed.ipa
